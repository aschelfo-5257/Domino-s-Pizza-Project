<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Domino's Pizza</title>
    </head>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" href="favicon.ico">
    <body>
        <div class="container">
            <h1 class="text-center mt-5">Domino's Pizza</h1>
            <div class="row mt-4">
                <div class="col-md-6">
                    <h2>Menu</h2>
                    <ul id="menu" class="list-group">
                        <!-- Menu items will be dynamically added here -->
                    </ul>
                </div>
                <div class="col-md-6">
                    <h2>Order Summary</h2>
                    <ul id="order-summary" class="list-group">
                        <!-- Order summary will be dynamically added here -->
                    </ul>
                    <button id="place-order" class="btn btn-primary mt-3">Place Order</button>

                    <button id="save-order" class="btn btn-secondary mt-3">Save Order</button>

                    <button id="load-order" class="btn btn-secondary mt-3">Load Order</button>

                    <button id="clear-order" class="btn btn-danger mt-3">Clear Order</button>

                    <div id="order-total" class="mt-3 fw-bold">Total: $0.00</div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
